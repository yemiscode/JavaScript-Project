<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tip Calculator</title>
    
      <!-- <link rel="stylesheet" type="text/css" media="screen" href="./bootstrap/css/bootstrap.min.css" /> -->
    <link rel="stylesheet" type="text/css" media="screen" href="style.css" />
  </head>
  <body>
   <section>
    <div class="contianer">
      <div class="calc">
        <h2>Tip Calculator</h2>
    
        <form action="">
        <div>    
               
          <label for="">Bill</label>
          <input type="text" class="bill" placeholder="$">
        </div>
        <div>
          <label for="">Rate Service</label>
          <select name="" class="rate">
            <option disabled selected value="">-- select an option --</option>
            <option value="0.15">15% - Excellent</option>
            <option value="0.1">10% - Good</option>
            <option value="0.05">5% - Fair</option>
          </select>
        </div>
      <div class="btn-error">
        <button type="button" class="btn">Calculate</button>      
        <p class="error">Please enter bill and rate service.</p>
      </div>
  
      </form>
      <div class="result">
        <div class="tip">Tip Amount: $0</div>
      <div class="total">Total Bill: $0</div>
    </div>
      
       </div>
      </div>
   </section>

    <script src="script.js"></script>
  </body>
</html>
